name: fallback-beat
# If the primary beat's machine goes dark, the repo keeps its own heart beating:
# mints a tick only when the newest anchor is >25 minutes old, otherwise stands down.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dogg-public-updates
  cancel-in-progress: false
jobs:
  beat-if-stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: mint if stale and refresh derived orientation
        run: |
          set -e
          BEAT_OUTPUT=$(python3 tools/fallback_beat.py)
          printf '%s\n' "$BEAT_OUTPUT"
          WORLD_REFRESH=not-attempted
          MESSAGE="chore: refresh public orientation"
          if printf '%s\n' "$BEAT_OUTPUT" | grep -q "^FALLBACK"; then
            if python3 tools/world.py; then
              WORLD_REFRESH=ok
            else
              WORLD_REFRESH=failed
              echo "::warning::World refresh failed; preserving the tick and last-good world observation."
            fi
            MESSAGE="fallback $(printf '%s\n' "$BEAT_OUTPUT" | grep -o 'tick [0-9]*' | head -1)"
          fi
          python3 tools/verify_thread.py
          python3 tools/orient.py --world-refresh "$WORLD_REFRESH"
          python3 tools/orient.py --check
          git config user.name "fallback-beat"
          git config user.email "actions@users.noreply.github.com"
          git add ticks world orient.json
          git diff --cached --quiet || { git commit -m "$MESSAGE"; git push; }
